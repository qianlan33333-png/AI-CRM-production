name: AI Audience Production Diagnostics (Read Only)

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact AI-CRM release SHA currently exposed by production
        required: true
        type: string
      confirmation:
        description: Exact read-only diagnostics confirmation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aicrm-ai-audience-production-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact production release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          ref: ${{ inputs.expected_release_sha }}
          fetch-depth: 0

      - name: Verify immutable release and confirmation
        run: |
          set -e
          set -o pipefail
          expected_release_sha='${{ inputs.expected_release_sha }}'
          confirmation='${{ inputs.confirmation }}'
          test "$confirmation" = 'DIAGNOSE AI-CRM AI AUDIENCE PRODUCTION READ ONLY'
          printf '%s' "$expected_release_sha" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$expected_release_sha"
          curl -sSf -D /tmp/aicrm-ai-audience-health.headers \
            "${{ vars.PUBLIC_HEALTH_URL }}" \
            -o /tmp/aicrm-ai-audience-health.json
          public_sha="$(awk 'tolower($1) == "x-aicrm-release-sha:" {gsub("\\r", "", $2); print $2}' /tmp/aicrm-ai-audience-health.headers)"
          test "$public_sha" = "$expected_release_sha"

      - name: Read timer and de-identified refresh evidence
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            set -o pipefail
            cd '/home/ubuntu/极简 crm'
            expected_release_sha='${{ inputs.expected_release_sha }}'
            test "$(git rev-parse HEAD)" = "$expected_release_sha"
            test "$(tr -d '\r\n' < .release-sha)" = "$expected_release_sha"
            sudo systemctl is-enabled --quiet aicrm-job-catalog-scheduler.timer
            sudo systemctl is-active --quiet aicrm-job-catalog-scheduler.timer
            sudo systemctl show aicrm-job-catalog-scheduler.timer \
              --property=ActiveState,UnitFileState,LastTriggerUSec,NextElapseUSecRealtime \
              --no-pager
            for unit in aicrm-ai-audience-daily-intent.timer aicrm-ai-audience-daily-intent.service
            do
              test "$(systemctl show "$unit" --property=LoadState --value 2>/dev/null || true)" = "not-found"
              test "$(systemctl is-enabled "$unit" 2>/dev/null || true)" != "enabled"
              test "$(systemctl is-active "$unit" 2>/dev/null || true)" != "active"
              test ! -e "/etc/systemd/system/$unit"
            done
            sudo systemctl is-enabled --quiet aicrm-internal-worker.service
            sudo systemctl is-active --quiet aicrm-internal-worker.service
            sudo systemctl show aicrm-internal-worker.service \
              --property=ActiveState,SubState,UnitFileState,NRestarts,ExecMainStatus,ExecMainCode,ActiveEnterTimestamp \
              --no-pager
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            source /home/ubuntu/venvs/openclaw/bin/activate
            python3 - <<'PY'
            import json

            from sqlalchemy import text

            from aicrm_next.platform.shared.db_session import get_session_factory


            with get_session_factory()() as session:
                package_state = dict(
                    session.execute(
                        text(
                            """
                            SELECT
                                COUNT(*) FILTER (WHERE status = 'active') AS active_package_count,
                                COUNT(*) FILTER (
                                    WHERE status = 'active' AND incremental_enabled = TRUE
                                ) AS incremental_package_count,
                                COUNT(*) FILTER (
                                    WHERE status = 'active' AND daily_enabled = TRUE
                                ) AS daily_package_count,
                                COUNT(*) FILTER (
                                    WHERE status = 'active'
                                      AND incremental_enabled = TRUE
                                      AND current_version_id IS NOT NULL
                                      AND (
                                        last_incremental_watermark_at IS NULL
                                        OR next_incremental_refresh_at <= CURRENT_TIMESTAMP
                                      )
                                ) AS incremental_due_count,
                                COUNT(*) FILTER (
                                    WHERE status = 'active'
                                      AND daily_enabled = TRUE
                                      AND current_version_id IS NOT NULL
                                      AND (
                                        last_daily_refreshed_at IS NULL
                                        OR next_daily_refresh_at <= CURRENT_TIMESTAMP
                                      )
                                ) AS daily_due_count,
                                MIN(last_incremental_watermark_at) AS oldest_incremental_watermark_at,
                                MAX(last_incremental_watermark_at) AS newest_incremental_watermark_at,
                                MIN(last_daily_refreshed_at) AS oldest_daily_refresh_at,
                                MAX(last_daily_refreshed_at) AS newest_daily_refresh_at
                            FROM ai_audience_package
                            """
                        )
                    ).mappings().one()
                )
                package_config_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT
                                package.query_mode,
                                package.incremental_enabled,
                                package.daily_enabled,
                                (NULLIF(BTRIM(version.incremental_sql_text), '') IS NOT NULL)
                                    AS incremental_sql_configured,
                                (NULLIF(BTRIM(version.snapshot_sql_text), '') IS NOT NULL)
                                    AS daily_sql_configured,
                                (NULLIF(BTRIM(version.simple_compiled_sql_text), '') IS NOT NULL)
                                    AS simple_compiled_sql_configured,
                                COUNT(*) AS row_count,
                                MIN(package.last_incremental_watermark_at)
                                    AS oldest_incremental_watermark_at,
                                MAX(package.last_incremental_watermark_at)
                                    AS newest_incremental_watermark_at,
                                MIN(package.last_daily_refreshed_at)
                                    AS oldest_daily_refresh_at,
                                MAX(package.last_daily_refreshed_at)
                                    AS newest_daily_refresh_at
                            FROM ai_audience_package package
                            JOIN ai_audience_package_version version
                              ON version.id = package.current_version_id
                            WHERE package.status = 'active'
                            GROUP BY
                                package.query_mode,
                                package.incremental_enabled,
                                package.daily_enabled,
                                (NULLIF(BTRIM(version.incremental_sql_text), '') IS NOT NULL),
                                (NULLIF(BTRIM(version.snapshot_sql_text), '') IS NOT NULL),
                                (NULLIF(BTRIM(version.simple_compiled_sql_text), '') IS NOT NULL)
                            ORDER BY
                                package.query_mode,
                                package.incremental_enabled,
                                package.daily_enabled,
                                incremental_sql_configured,
                                daily_sql_configured,
                                simple_compiled_sql_configured
                            """
                        )
                    ).mappings()
                ]
                intent_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT status, COUNT(*) AS row_count,
                                   MAX(updated_at) AS newest_updated_at
                            FROM ai_audience_refresh_intent
                            GROUP BY status
                            ORDER BY status
                            """
                        )
                    ).mappings()
                ]
                consumer_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT consumer_name, status, COUNT(*) AS row_count,
                                   MAX(updated_at) AS newest_updated_at
                            FROM internal_event_consumer_run
                            WHERE consumer_name IN (
                                'ai_audience_incremental_refresh_consumer',
                                'ai_audience_daily_refresh_consumer',
                                'ai_audience_refresh_intent_consumer'
                            )
                              AND updated_at >= CURRENT_TIMESTAMP - INTERVAL '24 hours'
                            GROUP BY consumer_name, status
                            ORDER BY consumer_name, status
                            """
                        )
                    ).mappings()
                ]
                runtime_heartbeat_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT service_name, queue_kind, generation, release_sha,
                                   rollout_mode, listener_connected,
                                   EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - heartbeat_at))::BIGINT
                                       AS heartbeat_age_seconds,
                                   last_notification_at, last_drain_at
                            FROM queue_worker_heartbeat
                            WHERE service_name IN (
                                'aicrm-internal_event-runtime',
                                'aicrm-internal_outbox-runtime'
                            )
                            ORDER BY service_name
                            """
                        )
                    ).mappings()
                ]
                refresh_outbox_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT status, lane, policy_version, worker_generation,
                                   COALESCE(NULLIF(hold_reason, ''), 'none') AS hold_reason,
                                   COALESCE(NULLIF(last_error_code, ''), 'none') AS last_error_code,
                                   COUNT(*) AS row_count,
                                   MAX(attempt_count) AS max_attempt_count,
                                   MAX(updated_at) AS newest_updated_at,
                                   MAX(relayed_at) AS newest_relayed_at
                            FROM internal_event_outbox
                            WHERE event_type = 'ai_audience.refresh.requested'
                            GROUP BY status, lane, policy_version, worker_generation,
                                     COALESCE(NULLIF(hold_reason, ''), 'none'),
                                     COALESCE(NULLIF(last_error_code, ''), 'none')
                            ORDER BY status, lane, policy_version, worker_generation
                            """
                        )
                    ).mappings()
                ]
                refresh_event_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT event_type, expected_consumer_count,
                                   fanout_manifest_version, fanout_manifest_hash,
                                   COUNT(*) AS row_count,
                                   MAX(created_at) AS newest_created_at
                            FROM internal_event
                            WHERE event_type = 'ai_audience.refresh.requested'
                            GROUP BY event_type, expected_consumer_count,
                                     fanout_manifest_version, fanout_manifest_hash
                            ORDER BY expected_consumer_count, fanout_manifest_version
                            """
                        )
                    ).mappings()
                ]
                refresh_consumer_run_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT run.consumer_name, run.status, run.lane,
                                   run.policy_version, run.worker_generation,
                                   COALESCE(NULLIF(run.hold_reason, ''), 'none') AS hold_reason,
                                   COALESCE(NULLIF(run.last_error_code, ''), 'none') AS last_error_code,
                                   COUNT(*) AS row_count,
                                   MAX(run.attempt_count) AS max_attempt_count,
                                   MAX(run.updated_at) AS newest_updated_at
                            FROM internal_event_consumer_run run
                            JOIN internal_event event ON event.event_id = run.event_id
                            WHERE event.event_type = 'ai_audience.refresh.requested'
                            GROUP BY run.consumer_name, run.status, run.lane,
                                     run.policy_version, run.worker_generation,
                                     COALESCE(NULLIF(run.hold_reason, ''), 'none'),
                                     COALESCE(NULLIF(run.last_error_code, ''), 'none')
                            ORDER BY run.consumer_name, run.status
                            """
                        )
                    ).mappings()
                ]
                refresh_intent_generation_state = [
                    dict(row)
                    for row in session.execute(
                        text(
                            """
                            SELECT status, target_refresh_kind,
                                   COUNT(*) AS row_count,
                                   MIN(dirty_generation - completed_generation) AS min_generation_gap,
                                   MAX(dirty_generation - completed_generation) AS max_generation_gap,
                                   MAX(signal_generation) AS max_signal_generation,
                                   MAX(completed_generation) AS max_completed_generation,
                                   MAX(attempt_count) AS max_attempt_count,
                                   COALESCE(NULLIF(last_error_code, ''), 'none') AS last_error_code,
                                   MAX(updated_at) AS newest_updated_at
                            FROM ai_audience_refresh_intent
                            GROUP BY status, target_refresh_kind,
                                     COALESCE(NULLIF(last_error_code, ''), 'none')
                            ORDER BY status, target_refresh_kind
                            """
                        )
                    ).mappings()
                ]

            print(
                json.dumps(
                    {
                        "ok": True,
                        "package_state": package_state,
                        "package_config_state": package_config_state,
                        "intent_state": intent_state,
                        "consumer_state": consumer_state,
                        "runtime_heartbeat_state": runtime_heartbeat_state,
                        "refresh_outbox_state": refresh_outbox_state,
                        "refresh_event_state": refresh_event_state,
                        "refresh_consumer_run_state": refresh_consumer_run_state,
                        "refresh_intent_generation_state": refresh_intent_generation_state,
                        "contains_package_or_target_identifiers": False,
                        "real_external_call_executed": False,
                    },
                    ensure_ascii=False,
                    sort_keys=True,
                    default=str,
                )
            )
            PY
