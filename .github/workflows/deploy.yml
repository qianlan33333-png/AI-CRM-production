name: Deploy Production Release
# Promotion attestation: AI-CRM candidate 46d110da / ID validation 94de2901.

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact AI-CRM main SHA selected by the guarded production promotion workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aicrm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.release_sha != ''
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: production
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
      PUBLIC_SERVER_NAME: ${{ vars.PUBLIC_SERVER_NAME }}
      NGINX_CONFIG_PATH: ${{ vars.NGINX_CONFIG_PATH }}
      ALLOW_MISSING_WECHAT_SHOP_CALLBACK_TOKEN: ${{ vars.ALLOW_MISSING_WECHAT_SHOP_CALLBACK_TOKEN || '0' }}
      RELEASE_TERMINAL_HISTORY_ACK_MODE: ${{ vars.RELEASE_TERMINAL_HISTORY_ACK_MODE || 'required' }}
      RELEASE_REFRESH_ATTEMPT_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout verified release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Build verified release bundle
        id: release
        run: |
          set -e
          set -o pipefail
          verified_sha="${{ inputs.release_sha }}"
          deploy_target="$DEPLOY_TARGET"
          if ! printf '%s' "$verified_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "invalid verified workflow sha"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$verified_sha" ]; then
            echo "runner checkout does not match verified workflow sha"
            exit 1
          fi
          git fetch --no-tags origin main
          if [ "$deploy_target" != "production" ]; then
            echo "AI-CRM deploy workflow is production-only"
            exit 1
          fi
          if [ "$(git rev-parse FETCH_HEAD)" != "$verified_sha" ]; then
            echo "requested production release is not the current repository main"
            exit 1
          fi
          public_base_url="${PUBLIC_BASE_URL%/}"
          public_health_url="$PUBLIC_HEALTH_URL"
          if ! printf '%s' "$public_base_url" | grep -Eq '^https://[^/]+$'; then
            echo "PUBLIC_BASE_URL must be an https origin"
            exit 1
          fi
          if ! printf '%s' "$public_health_url" | grep -Eq '^https://[^/]+/health$'; then
            echo "PUBLIC_HEALTH_URL must be an https /health URL"
            exit 1
          fi
          curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -sSf \
            -D /tmp/aicrm_current_release_headers.txt \
            "$public_health_url" \
            -o /tmp/aicrm_current_release.json
          base_sha="$(awk 'tolower($1) == "x-aicrm-release-sha:" {print $2}' \
            /tmp/aicrm_current_release_headers.txt | tr -d '\r' | tail -n 1)"
          if ! printf '%s' "$base_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "target environment does not expose a full current release sha"
            exit 1
          fi
          if [ "$base_sha" = "$verified_sha" ]; then
            echo "target environment already runs the requested release"
            exit 1
          fi
          if ! git cat-file -e "$base_sha^{commit}"; then
            echo "production release is not present in repository history"
            exit 1
          elif ! git merge-base --is-ancestor "$base_sha" "$verified_sha"; then
            echo "production release is not an ancestor of the requested release"
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "bundle_mode=incremental" >> "$GITHUB_OUTPUT"
          mkdir -p release
          git update-ref refs/deploy/release "$verified_sha"
          git update-ref refs/deploy/base "$base_sha"
          trap 'git update-ref -d refs/deploy/release; git update-ref -d refs/deploy/base' EXIT
          git bundle create release/aicrm-release.bundle refs/deploy/release ^refs/deploy/base
          git bundle verify release/aicrm-release.bundle
          if ! git bundle list-heads release/aicrm-release.bundle \
            | grep -Fx "$verified_sha refs/deploy/release" >/dev/null; then
            echo "release bundle does not advertise the verified workflow sha"
            exit 1
          fi
          (
            cd release
            sha256sum aicrm-release.bundle > aicrm-release.bundle.sha256
          )

      - name: Transfer verified release bundle
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "release/aicrm-release.bundle,release/aicrm-release.bundle.sha256"
          target: /tmp/aicrm-release-${{ inputs.release_sha }}
          strip_components: 1
          overwrite: true

      - name: Reconcile authorized AI Audience binding history
        if: >-
          steps.release.outputs.base_sha == '3b045574ef1b5b322716ee7a62aa86fd3507df43' ||
          steps.release.outputs.base_sha == 'fd03cc53b094044d9ae798aa214606155b925f22' ||
          steps.release.outputs.base_sha == 'b290bada598c76a1e12bb2ade8c020dcfd8849e5'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            set -o pipefail
            cd /home/ubuntu/"极简 crm"
            candidate_sha='${{ inputs.release_sha }}'
            remediation_base_sha='${{ steps.release.outputs.base_sha }}'
            case "$remediation_base_sha" in
              3b045574ef1b5b322716ee7a62aa86fd3507df43)
                remediation_manifest='deploy/ai_audience_binding_history_remediation.json'
                remediation_confirmation='EXECUTE_AI_AUDIENCE_BINDING_HISTORY_20260801'
                ;;
              fd03cc53b094044d9ae798aa214606155b925f22)
                remediation_manifest='deploy/retired_ai_audience_binding_remediation.json'
                remediation_confirmation='EXECUTE_RETIRED_AI_AUDIENCE_BINDING_20260802'
                ;;
              b290bada598c76a1e12bb2ade8c020dcfd8849e5)
                remediation_manifest='deploy/ai_audience_e2e_subscription_residue_20260804.json'
                remediation_confirmation='EXECUTE_AI_AUDIENCE_E2E_RESIDUE_20260804'
                ;;
              *)
                echo "unsupported remediation base sha: $remediation_base_sha"
                exit 1
                ;;
            esac
            test "$(git rev-parse HEAD)" = "$remediation_base_sha"
            test "$(tr -d '\r\n' < .release-sha)" = "$remediation_base_sha"
            deploy_lock_file="/tmp/aicrm-deploy-production.lock"
            exec 9>"$deploy_lock_file"
            if ! flock -n 9; then
              echo "another production deployment holds $deploy_lock_file"
              exit 1
            fi
            candidate_bundle_dir="/tmp/aicrm-release-$candidate_sha"
            candidate_bundle="$candidate_bundle_dir/aicrm-release.bundle"
            candidate_bundle_checksum="$candidate_bundle_dir/aicrm-release.bundle.sha256"
            test -r "$candidate_bundle"
            test -r "$candidate_bundle_checksum"
            (
              cd "$candidate_bundle_dir"
              sha256sum --check aicrm-release.bundle.sha256
            )
            git bundle verify "$candidate_bundle"
            git fetch --no-tags "$candidate_bundle" \
              "+refs/deploy/release:refs/remotes/deploy/remediation"
            test "$(git rev-parse refs/remotes/deploy/remediation)" = "$candidate_sha"
            remediation_dir="$(mktemp -d /tmp/aicrm-binding-remediation.XXXXXX)"
            cleanup_remediation() {
              rm -rf -- "$remediation_dir"
            }
            trap cleanup_remediation EXIT
            git archive "$candidate_sha" \
              aicrm_next \
              scripts/ops/remediate_ai_audience_binding_history.py \
              "$remediation_manifest" \
              | tar -x -C "$remediation_dir"
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            source /home/ubuntu/venvs/openclaw/bin/activate
            cd "$remediation_dir"
            PYTHONPATH="$remediation_dir" python3 \
              scripts/ops/remediate_ai_audience_binding_history.py \
              --manifest "$remediation_manifest" \
              --mode preview \
              --current-release-sha "$remediation_base_sha" \
              | tee /tmp/aicrm-binding-remediation-preview.json
            python3 -c 'import json; data=json.load(open("/tmp/aicrm-binding-remediation-preview.json", encoding="utf-8")); assert data["ok"] is True; assert data["status"] in {"ready", "already_applied"}; assert data["database_write_executed"] is False; assert data["real_external_call_executed"] is False'
            PYTHONPATH="$remediation_dir" python3 \
              scripts/ops/remediate_ai_audience_binding_history.py \
              --manifest "$remediation_manifest" \
              --mode apply \
              --confirmation "$remediation_confirmation" \
              --current-release-sha "$remediation_base_sha" \
              | tee /tmp/aicrm-binding-remediation-apply.json
            python3 -c 'import json; data=json.load(open("/tmp/aicrm-binding-remediation-apply.json", encoding="utf-8")); assert data["ok"] is True; assert data["status"] in {"applied", "already_applied"}; assert data["real_external_call_executed"] is False; assert data["backup_created"] is (data["status"] == "applied")'

      - name: Repair authorized failed WeCom media lease
        if: steps.release.outputs.base_sha == 'fd03cc53b094044d9ae798aa214606155b925f22'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            set -o pipefail
            cd /home/ubuntu/"极简 crm"
            candidate_sha='${{ inputs.release_sha }}'
            remediation_base_sha='${{ steps.release.outputs.base_sha }}'
            remediation_manifest='deploy/failed_wecom_media_lease_remediation.json'
            remediation_confirmation='EXECUTE_FAILED_WECOM_MEDIA_LEASE_20260802'
            test "$remediation_base_sha" = 'fd03cc53b094044d9ae798aa214606155b925f22'
            test "$(git rev-parse HEAD)" = "$remediation_base_sha"
            test "$(tr -d '\r\n' < .release-sha)" = "$remediation_base_sha"
            deploy_lock_file="/tmp/aicrm-deploy-production.lock"
            exec 9>"$deploy_lock_file"
            if ! flock -n 9; then
              echo "another production deployment holds $deploy_lock_file"
              exit 1
            fi
            candidate_bundle_dir="/tmp/aicrm-release-$candidate_sha"
            candidate_bundle="$candidate_bundle_dir/aicrm-release.bundle"
            candidate_bundle_checksum="$candidate_bundle_dir/aicrm-release.bundle.sha256"
            test -r "$candidate_bundle"
            test -r "$candidate_bundle_checksum"
            (
              cd "$candidate_bundle_dir"
              sha256sum --check aicrm-release.bundle.sha256
            )
            git bundle verify "$candidate_bundle"
            git fetch --no-tags "$candidate_bundle" \
              "+refs/deploy/release:refs/remotes/deploy/media-lease-remediation"
            test "$(git rev-parse refs/remotes/deploy/media-lease-remediation)" = "$candidate_sha"
            remediation_dir="$(mktemp -d /tmp/aicrm-media-lease-remediation.XXXXXX)"
            cleanup_remediation() {
              rm -rf -- "$remediation_dir"
            }
            trap cleanup_remediation EXIT
            git archive "$candidate_sha" \
              aicrm_next \
              tools \
              scripts/ops/remediate_failed_wecom_media_lease.py \
              "$remediation_manifest" \
              | tar -x -C "$remediation_dir"
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            source /home/ubuntu/venvs/openclaw/bin/activate
            cd "$remediation_dir"
            PYTHONPATH="$remediation_dir" python3 \
              scripts/ops/remediate_failed_wecom_media_lease.py \
              --manifest "$remediation_manifest" \
              --mode preview \
              --current-release-sha "$remediation_base_sha" \
              | tee /tmp/aicrm-media-lease-remediation-preview.json
            python3 -c 'import json; data=json.load(open("/tmp/aicrm-media-lease-remediation-preview.json", encoding="utf-8")); assert data["ok"] is True; assert data["status"] in {"ready", "already_applied"}; assert data["candidate_count"] in {0, 1}; assert data["database_write_executed"] is False; assert data["real_external_call_executed"] is False; assert data["contains_raw_material_identifier"] is False'
            PYTHONPATH="$remediation_dir" python3 \
              scripts/ops/remediate_failed_wecom_media_lease.py \
              --manifest "$remediation_manifest" \
              --mode apply \
              --confirmation "$remediation_confirmation" \
              --current-release-sha "$remediation_base_sha" \
              | tee /tmp/aicrm-media-lease-remediation-apply.json
            python3 -c 'import json; data=json.load(open("/tmp/aicrm-media-lease-remediation-apply.json", encoding="utf-8")); assert data["ok"] is True; assert data["status"] in {"applied", "already_applied"}; assert data["database_write_executed"] is (data["status"] == "applied"); assert data["real_external_call_executed"] is (data["status"] == "applied"); assert data["backup_created"] is (data["status"] == "applied"); assert data["contains_raw_material_identifier"] is False'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: RELEASE_REFRESH_ATTEMPT_KEY,RELEASE_TERMINAL_HISTORY_ACK_MODE
          script: |
            set -e
            set -o pipefail
            runtime_mutation_started=0
            runtime_committed=0
            release_control_dir=""
            release_control_manager=""
            release_control_manifest=""
            previous_control_dir=""
            previous_control_manager=""
            previous_control_manifest=""
            restore_control_manager=""
            restore_control_manifest=""
            restore_runtime_phase() {
              python3 "$restore_control_manager" \
                --manifest "$restore_control_manifest" \
                --phase "$1" --execute
            }
            cd '/home/ubuntu/极简 crm'
            deploy_target="${{ env.DEPLOY_TARGET }}"
            deploy_lock_file="/tmp/aicrm-deploy-${deploy_target}.lock"
            exec 9>"$deploy_lock_file"
            if ! flock -n 9; then
              echo "another $deploy_target deployment holds $deploy_lock_file"
              exit 1
            fi
            cd '/home/ubuntu/极简 crm'
            before_sha="$(git rev-parse HEAD)"
            verified_sha="${{ inputs.release_sha }}"
            base_sha="${{ steps.release.outputs.base_sha }}"
            bundle_mode="${{ steps.release.outputs.bundle_mode }}"
            if ! printf '%s' "$verified_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "invalid verified workflow sha"
              exit 1
            fi
            if [ "$deploy_target" != "production" ]; then
              echo "AI-CRM remote deploy target must be production"
              exit 1
            fi
            if [ "$bundle_mode" != "incremental" ]; then
              echo "invalid release bundle mode"
              exit 1
            fi
            if [ "$before_sha" != "$base_sha" ]; then
              echo "target checkout moved after the release bundle was built"
              exit 1
            fi
            release_bundle_dir="/tmp/aicrm-release-$verified_sha"
            release_bundle="/tmp/aicrm-release-$verified_sha/aicrm-release.bundle"
            release_bundle_checksum="/tmp/aicrm-release-$verified_sha/aicrm-release.bundle.sha256"
            deploy_smoke_session_file=""
            runtime_units_stopped=0
            runtime_transaction_partial=0
            release_switched=0
            release_committed=0
            restore_expected_sha="$before_sha"
            cleanup_deploy() {
              exit_status=$?
              trap - EXIT
              set +e
              cleanup_failed=0
              if [ -n "${deploy_smoke_session_file:-}" ] && [ -e "$deploy_smoke_session_file" ]; then
                if ! python3 scripts/ops/create_deploy_smoke_session.py revoke \
                  --cookie-file "$deploy_smoke_session_file" \
                  | tee /tmp/aicrm-deploy-smoke-session-cleanup.json; then
                  echo "failed to revoke temporary deploy smoke session"
                  cleanup_failed=1
                fi
                rm -f -- "$deploy_smoke_session_file"
              fi
              if [ "$exit_status" -ne 0 ] \
                && [ "${runtime_mutation_started:-0}" = "1" ] \
                && [ "${runtime_committed:-0}" != "1" ]; then
                if [ "${runtime_units_stopped:-0}" = "1" ]; then
                  if ! python3 "$release_control_manager" \
                    --manifest "$release_control_manifest" \
                    --phase begin-transaction --execute; then
                    cleanup_failed=1
                  fi
                  if ! python3 "$release_control_manager" \
                    --manifest "$release_control_manifest" \
                    --phase stop-for-migration-recovery --execute; then
                    cleanup_failed=1
                  fi
                else
                  echo "runtime stop did not complete; preserving active one-shot workers during rollback"
                  runtime_transaction_partial=1
                fi
              fi
              if [ "$exit_status" -ne 0 ] \
                && [ "${release_switched:-0}" = "1" ] \
                && [ "${release_committed:-0}" != "1" ]; then
                echo "deployment failed before commit; rolling back to $before_sha"
                if [ "${runtime_units_stopped:-0}" = "1" ]; then
                  sudo systemctl stop aicrm-web.service || true
                  sudo systemctl stop openclaw-wecom-postgres.service || true
                else
                  echo "primary Web remains active while the partial runtime transaction is rolled back"
                fi
                if ! python3 "$release_control_manager" \
                  --manifest "$release_control_manifest" \
                  --previous-manifest "$previous_control_manifest" \
                  --phase remove-candidate-only-runtime --execute; then
                  echo "failed to remove candidate-only runtime units"
                  cleanup_failed=1
                fi
                if git reset --hard "$before_sha"; then
                  printf '%s\n' "$before_sha" > .release-sha
                  if ! git diff --quiet "$before_sha" "$verified_sha" -- requirements.lock; then
                    if ! /home/ubuntu/venvs/openclaw/bin/python -m pip install \
                      --require-hashes -r requirements.lock; then
                      echo "failed to restore dependencies for $before_sha"
                      cleanup_failed=1
                    fi
                  fi
                else
                  echo "failed to restore checkout to $before_sha"
                  cleanup_failed=1
                fi
                restore_control_manager="$previous_control_manager"
                restore_control_manifest="$previous_control_manifest"
              fi
              if [ "${runtime_units_stopped:-0}" = "1" ]; then
                echo "restoring runtime units for $restore_expected_sha"
                if ! restore_runtime_phase authorize-web-start; then
                  cleanup_failed=1
                fi
                sudo systemctl reset-failed \
                  openclaw-wecom-postgres.service || true
                sudo systemctl start openclaw-wecom-postgres.service
                restored_web_ready=0
                for _ in $(seq 1 30); do
                  if curl -sSf -D /tmp/aicrm_cleanup_health_headers.txt \
                    http://127.0.0.1:5001/health \
                    -o /tmp/aicrm_cleanup_health.json \
                    && grep -i "x-aicrm-release-sha: $restore_expected_sha" \
                      /tmp/aicrm_cleanup_health_headers.txt; then
                    restored_web_ready=1
                    break
                  fi
                  sleep 1
                done
                if [ "$restored_web_ready" = "1" ]; then
                  if ! restore_runtime_phase authorize-runtime-start; then
                    cleanup_failed=1
                  fi
                  if ! restore_runtime_phase install-enable-after-web-health; then
                    cleanup_failed=1
                  fi
                  if ! restore_runtime_phase verify-staged-runtime; then
                    cleanup_failed=1
                  fi
                  if ! restore_runtime_phase release-runtime-guard; then
                    cleanup_failed=1
                  fi
                else
                  echo "web health unavailable; runtime units could not be safely restored"
                  cleanup_failed=1
                fi
              fi
              if [ "${runtime_transaction_partial:-0}" = "1" ] \
                && [ "${runtime_units_stopped:-0}" != "1" ]; then
                echo "restoring timers after a partial runtime stop for $restore_expected_sha"
                partial_web_ready=0
                for _ in $(seq 1 10); do
                  if curl -sSf -D /tmp/aicrm_cleanup_partial_health_headers.txt \
                    http://127.0.0.1:5001/health \
                    -o /tmp/aicrm_cleanup_partial_health.json \
                    && grep -i "x-aicrm-release-sha: $restore_expected_sha" \
                      /tmp/aicrm_cleanup_partial_health_headers.txt; then
                    partial_web_ready=1
                    break
                  fi
                  sleep 1
                done
                if [ "$partial_web_ready" = "1" ]; then
                  if ! restore_runtime_phase authorize-runtime-restore; then
                    cleanup_failed=1
                  fi
                  if ! restore_runtime_phase install-enable-after-web-health; then
                    cleanup_failed=1
                  fi
                  if ! restore_runtime_phase verify-staged-runtime; then
                    cleanup_failed=1
                  fi
                  if ! restore_runtime_phase release-runtime-guard; then
                    cleanup_failed=1
                  fi
                  runtime_transaction_partial=0
                else
                  echo "existing Web health unavailable; partially stopped timers could not be restored"
                  cleanup_failed=1
                fi
              fi
              rm -rf -- "$previous_control_dir"
              rm -rf -- "$release_control_dir"
              rm -rf -- "$release_bundle_dir"
              if [ "$exit_status" -eq 0 ] && [ "$cleanup_failed" -ne 0 ]; then
                exit_status=1
              fi
              exit "$exit_status"
            }
            trap cleanup_deploy EXIT
            if [ ! -r "$release_bundle" ] || [ ! -r "$release_bundle_checksum" ]; then
              echo "verified release bundle or checksum is missing"
              exit 1
            fi
            (
              cd "$release_bundle_dir"
              sha256sum -c aicrm-release.bundle.sha256
            )
            git bundle verify "$release_bundle"
            if ! git bundle list-heads "$release_bundle" \
              | grep -Fx "$verified_sha refs/deploy/release" >/dev/null; then
              echo "release bundle does not advertise the verified workflow sha"
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked -m "deploy-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git fetch --no-tags "$release_bundle" "refs/deploy/release:refs/remotes/deploy/main"
            release_head_sha="$(git rev-parse refs/remotes/deploy/main)"
            if [ "$release_head_sha" != "$verified_sha" ]; then
              echo "verified workflow sha is no longer the repository main head"
              exit 1
            fi
            release_control_dir="$(mktemp -d /tmp/aicrm-release-control.XXXXXX)"
            previous_control_dir="$(mktemp -d /tmp/aicrm-previous-control.XXXXXX)"
            git archive "$before_sha" \
              app.py \
              scripts \
              deploy \
              | tar -x -C "$previous_control_dir"
            previous_control_manager="$previous_control_dir/scripts/ops/manage_production_runtime_units.py"
            previous_control_manifest="$previous_control_dir/deploy/production_runtime_units.json"
            git archive "$verified_sha" \
              app.py \
              scripts \
              deploy \
              | tar -x -C "$release_control_dir"
            release_control_manager="$release_control_dir/scripts/ops/manage_production_runtime_units.py"
            release_control_manifest="$release_control_dir/deploy/production_runtime_units.json"
            restore_control_manager="$release_control_manager"
            restore_control_manifest="$release_control_manifest"
            git reset --hard "$verified_sha"
            release_switched=1
            after_sha="$(git rev-parse HEAD)"
            if [ "$after_sha" != "$verified_sha" ]; then
              echo "deployed checkout does not match verified workflow sha"
              exit 1
            fi
            printf '%s\n' "$after_sha" > .release-sha
            python3 scripts/ops/manage_production_runtime_units.py --phase retire-legacy-overlays --execute
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            test -n "${DATABASE_URL:-}"
            source /home/ubuntu/venvs/openclaw/bin/activate
            if [ "$before_sha" = "$after_sha" ] || git diff --quiet "$before_sha" "$after_sha" -- requirements.lock; then
              echo "requirements.lock unchanged; skipping pip install"
            else
              python -m pip install --require-hashes -r requirements.lock
            fi
            python3 scripts/ops/ensure_ai_audience_external_api_env.py /home/ubuntu/.openclaw-wecom-pg.env
            auth_issuer="${{ env.PUBLIC_BASE_URL }}"
            if ! printf '%s' "$auth_issuer" | grep -Eq '^https://[^/]+$'; then
              echo "PUBLIC_BASE_URL must be an https origin"
              exit 1
            fi
            runtime_environment_args=()
            if [ "${{ env.ALLOW_MISSING_WECHAT_SHOP_CALLBACK_TOKEN }}" = "1" ]; then
              runtime_environment_args+=(--allow-missing-wechat-shop-callback-token)
            fi
            python3 -m scripts.ops.ensure_runtime_environment \
              --environment-file /home/ubuntu/.openclaw-wecom-pg.env \
              --target-environment "$deploy_target" \
              --public-base-url "$auth_issuer" \
              --deployment-profile-path '/home/ubuntu/极简 crm/deploy/deployment_profiles/production-current.json' \
              "${runtime_environment_args[@]}"
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            python3 -m scripts.ops.validate_production_deployment_profile --binding-check \
              --expected-profile-path '/home/ubuntu/极简 crm/deploy/deployment_profiles/production-current.json' \
              | tee /tmp/aicrm-deployment-profile-preflight.json
            # Identity preflight must fail before any runtime unit is stopped.
            python3 scripts/ops/check_unionid_identity_cutover.py \
              --phase preflight \
              --register-existing-conflicts \
              --expected-release-sha "$after_sha" \
              | tee /tmp/aicrm-identity-preflight.json
            python3 scripts/ops/check_ai_audience_send_records_release.py --phase preflight --sha "$after_sha"
            runtime_mutation_started=1
            runtime_transaction_partial=1
            python3 "$release_control_manager" \
              --manifest "$release_control_manifest" \
              --phase begin-transaction --execute
            python3 scripts/ops/recover_identity_resolution_worker_deadlock.py \
              --execute \
              | tee /tmp/aicrm-identity-worker-deadlock-recovery.json
            python3 "$release_control_manager" \
              --manifest "$release_control_manifest" \
              --phase stop-for-migration --execute
            runtime_units_stopped=1
            runtime_transaction_partial=0
            if sudo fuser -s 5001/tcp; then
              echo "5001 is still occupied before release mutation; terminating stale listener"
              sudo ss -ltnp 'sport = :5001' || true
              sudo fuser -k -TERM 5001/tcp || true
              sleep 2
            fi
            if sudo fuser -s 5001/tcp; then
              echo "5001 listener survived TERM; force killing stale listener"
              sudo ss -ltnp 'sport = :5001' || true
              sudo fuser -k -KILL 5001/tcp || true
            fi
            for _ in $(seq 1 10); do
              if ! sudo fuser -s 5001/tcp; then
                break
              fi
              echo "waiting for stale 5001 listener to exit"
              sleep 1
            done
            if sudo fuser -s 5001/tcp; then
              echo "5001 is still occupied after stale listener cleanup"
              sudo ss -ltnp 'sport = :5001' || true
              exit 1
            fi
            python3 -m alembic upgrade head
            python3 scripts/ops/check_ai_audience_send_records_release.py --phase post-migration --sha "$after_sha"
            export AICRM_SECRET_STORE_DIR="${AICRM_SECRET_STORE_DIR:-/home/ubuntu/.aicrm-secrets}"
            python3 scripts/ops/migrate_app_setting_secrets.py --execute \
              --secret-store-dir "$AICRM_SECRET_STORE_DIR" \
              --environment-file /home/ubuntu/.openclaw-wecom-pg.env \
              | tee /tmp/aicrm-secret-migration.json
            python3 scripts/ops/bootstrap_auth_clients.py \
              --apply \
              --issuer "$auth_issuer" \
              --secret-store-dir "$AICRM_SECRET_STORE_DIR" \
              --environment-file /home/ubuntu/.openclaw-wecom-pg.env \
              | tee /tmp/aicrm-auth-client-bootstrap.json
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            python3 scripts/ops/check_auth_readiness.py \
              --issuer "$auth_issuer" \
              --secret-store-dir "$AICRM_SECRET_STORE_DIR" \
              --environment-file /home/ubuntu/.openclaw-wecom-pg.env \
              | tee /tmp/aicrm-auth-readiness.json
            python3 scripts/ops/check_secret_reference_cutover.py \
              --secret-store-dir "$AICRM_SECRET_STORE_DIR" \
              --environment-file /home/ubuntu/.openclaw-wecom-pg.env \
              | tee /tmp/aicrm-secret-reconciliation.json
            python3 scripts/ops/manage_production_runtime_units.py --phase install-primary-web --execute
            python3 scripts/ops/manage_production_runtime_units.py --phase authorize-web-start --execute
            sudo systemctl reset-failed openclaw-wecom-postgres.service || true
            if ! sudo systemctl start openclaw-wecom-postgres.service; then
              sudo systemctl status openclaw-wecom-postgres.service --no-pager || true
              sudo journalctl -u openclaw-wecom-postgres.service -n 80 --no-pager || true
              sudo ss -ltnp 'sport = :5001' || true
              exit 1
            fi
            release_ready=0
            for _ in $(seq 1 60); do
              if curl -sSf -D /tmp/aicrm_health_headers.txt http://127.0.0.1:5001/health -o /tmp/aicrm_health.json \
                && grep -i "x-aicrm-release-sha: $after_sha" /tmp/aicrm_health_headers.txt; then
                release_ready=1
                break
              fi
              actual_release_sha="$(awk 'tolower($1) == "x-aicrm-release-sha:" {print $2}' /tmp/aicrm_health_headers.txt 2>/dev/null | tr -d '\r' | tail -n 1 || true)"
              echo "waiting for 5001 release sha: expected=$after_sha actual=${actual_release_sha:-missing}"
              sleep 1
            done
            if [ "$release_ready" != "1" ]; then
              sudo systemctl status openclaw-wecom-postgres.service --no-pager || true
              sudo journalctl -u openclaw-wecom-postgres.service -n 80 --no-pager || true
              exit 1
            fi
            cat /tmp/aicrm_health.json
            python3 scripts/ops/check_unionid_identity_cutover.py \
              --phase post-deploy \
              --expected-release-sha "$after_sha" \
              | tee /tmp/aicrm-identity-reconciliation.json
            runtime_secret_args=()
            if [ "${{ env.ALLOW_MISSING_WECHAT_SHOP_CALLBACK_TOKEN }}" = "1" ]; then
              runtime_secret_args+=(--allow-missing-wechat-shop-callback-token)
            fi
            python scripts/ops/check_runtime_secret_readiness.py \
              --base-url http://127.0.0.1:5001 \
              --expected-sha "$after_sha" \
              --expected-callback-url "$auth_issuer/auth/wecom/callback" \
              "${runtime_secret_args[@]}" \
              | tee /tmp/aicrm-runtime-secret-readiness.json
            export AICRM_CUSTOMER_READ_MODEL_RELEASE_REFRESH_AUTHORIZED=1
            python3 scripts/ops/run_release_customer_read_model_refresh.py \
              --release-sha "$after_sha" \
              --attempt-key "$RELEASE_REFRESH_ATTEMPT_KEY" \
              | tee /tmp/aicrm-customer-read-model-release-refresh.json
            unset AICRM_CUSTOMER_READ_MODEL_RELEASE_REFRESH_AUTHORIZED
            export AICRM_QUEUE_TERMINAL_ACK_AUTHORIZED=1
            python3 scripts/ops/acknowledge_release_terminal_histories.py \
              --release-sha "$after_sha" \
              --actor github-actions \
              --mode "$RELEASE_TERMINAL_HISTORY_ACK_MODE" \
              --apply \
              | tee /tmp/aicrm-release-terminal-history-acknowledgements.json
            unset AICRM_QUEUE_TERMINAL_ACK_AUTHORIZED
            # Replace any pre-deploy timer generation before the all-green smoke.
            if ! DB_APPLICATION_NAME=aicrm-next-deploy-data-health \
              PGAPPNAME=aicrm-next-deploy-data-health \
              DB_POOL_SIZE=1 \
              DB_MAX_OVERFLOW=0 \
              PGOPTIONS='-c statement_timeout=120s -c idle_in_transaction_session_timeout=60s -c lock_timeout=5s' \
              python3 scripts/ops/refresh_data_health_snapshot.py \
                --expected-release-sha "$after_sha" \
                | tee /tmp/aicrm-data-health-release-snapshot.json; then
              sudo systemctl status openclaw-wecom-postgres.service --no-pager || true
              sudo journalctl -u openclaw-wecom-postgres.service -n 120 --no-pager || true
              exit 1
            fi
            deploy_smoke_session_file="$(mktemp /tmp/aicrm-deploy-smoke-session.XXXXXX)"
            python3 scripts/ops/create_deploy_smoke_session.py issue \
              --output-file "$deploy_smoke_session_file" \
              --ttl-seconds 300 \
              | tee /tmp/aicrm-deploy-smoke-session-issue.json
            admin_smoke_sidebar_args=(
              --include-all-sidebar
              --require-all-data-health-green
              --allow-ai-automation-pre-cutover
            )
            if ! python scripts/ops/check_admin_read_pages_smoke.py \
              --base-url http://127.0.0.1:5001 \
              --require-admin-cookie \
              --admin-cookie-file "$deploy_smoke_session_file" \
              "${admin_smoke_sidebar_args[@]}" \
              | tee /tmp/aicrm-admin-read-pages-smoke.json; then
              sudo systemctl status openclaw-wecom-postgres.service --no-pager || true
              sudo journalctl -u openclaw-wecom-postgres.service -n 120 --no-pager || true
              exit 1
            fi
            python3 scripts/ops/create_deploy_smoke_session.py revoke \
              --cookie-file "$deploy_smoke_session_file" \
              | tee /tmp/aicrm-deploy-smoke-session-revoke.json
            deploy_smoke_session_file=""
            python3 scripts/ops/manage_production_runtime_units.py --phase authorize-runtime-start --execute
            python3 scripts/ops/manage_production_runtime_units.py --phase install-enable-after-web-health --execute
            callback_smoke_ready=0
            for callback_smoke_attempt in 1 2; do
              if python scripts/ops/check_wecom_callback_deploy_smoke.py \
                | tee /tmp/wecom-callback-deploy-smoke.json; then
                callback_smoke_ready=1
                break
              fi
              if [ "$callback_smoke_attempt" -lt 2 ]; then
                echo "callback deploy smoke failed during runtime warm-up; retrying once"
                sleep 2
              fi
            done
            if [ "$callback_smoke_ready" != "1" ]; then
              sudo systemctl status openclaw-wecom-callback-ingress.service --no-pager || true
              sudo journalctl -u openclaw-wecom-callback-ingress.service -n 120 --no-pager || true
              exit 1
            fi
            python3 scripts/ops/manage_production_runtime_units.py --phase verify-staged-runtime --execute
            python3 scripts/ops/check_runtime_readiness.py --base-url http://127.0.0.1:5001 \
              | tee /tmp/aicrm-runtime-readiness.json
            # Count-only R06 reconciliation. This command never repairs rows or executes consumers/providers.
            python scripts/ops/reconcile_internal_event_outbox.py \
              | tee /tmp/aicrm-internal-event-outbox-reconciliation.json
            # Count-only R08 commerce fulfillment reconciliation. Never repairs or calls providers.
            python scripts/ops/reconcile_commerce_fulfillment.py \
              | tee /tmp/aicrm-commerce-fulfillment-reconciliation.json
            # Count-only R09 questionnaire/radar reconciliation. Never repairs or executes consumers/providers.
            python scripts/ops/reconcile_questionnaire_radar.py \
              | tee /tmp/aicrm-questionnaire-radar-reconciliation.json
            # Count-only R10 Group Ops/broadcast reconciliation. Never repairs, resends, or calls providers.
            python scripts/ops/reconcile_group_ops_broadcast.py \
              | tee /tmp/aicrm-group-ops-broadcast-reconciliation.json
            test -n "${{ env.PUBLIC_SERVER_NAME }}"
            test -n "${{ env.NGINX_CONFIG_PATH }}"
            sudo /home/ubuntu/venvs/openclaw/bin/python \
              scripts/ops/ensure_production_public_release_route.py --execute \
              --expected-sha "$after_sha" \
              --server-name "${{ env.PUBLIC_SERVER_NAME }}" \
              --nginx-config "${{ env.NGINX_CONFIG_PATH }}" \
              --local-health-url http://127.0.0.1:5001/health \
              --public-health-url "${{ env.PUBLIC_HEALTH_URL }}" \
              | tee /tmp/aicrm-public-release-route.json
            python3 scripts/ops/manage_production_runtime_units.py --phase release-runtime-guard --execute
            runtime_units_stopped=0
            runtime_committed=1
            release_committed=1
