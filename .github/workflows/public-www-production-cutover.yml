name: Cut Over WWW to Current Production Release

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact current main SHA already deployed on the production host
        required: true
        type: string
      confirmation:
        description: Type CUTOVER_PUBLIC_WWW_TO_CURRENT_RELEASE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aicrm-production-public-www-cutover
  cancel-in-progress: false

jobs:
  cutover:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      CUTOVER_CONFIRMATION: ${{ inputs.confirmation }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      PUBLIC_SERVER_NAME: ${{ vars.PUBLIC_SERVER_NAME }}
      NGINX_CONFIG_PATH: ${{ vars.NGINX_CONFIG_PATH }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Validate exact release and confirmation
        run: |
          set -e
          test "$CUTOVER_CONFIRMATION" = 'CUTOVER_PUBLIC_WWW_TO_CURRENT_RELEASE'
          printf '%s' "$EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_RELEASE_SHA"
          test "$PUBLIC_BASE_URL" = 'https://www.youcangogogo.com'
          test "$PUBLIC_SERVER_NAME" = 'www.youcangogogo.com'
          test -n "$NGINX_CONFIG_PATH"

      - name: Cut over guarded WWW root route
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_RELEASE_SHA: ${{ env.EXPECTED_RELEASE_SHA }}
          PUBLIC_BASE_URL: ${{ env.PUBLIC_BASE_URL }}
          PUBLIC_SERVER_NAME: ${{ env.PUBLIC_SERVER_NAME }}
          NGINX_CONFIG_PATH: ${{ env.NGINX_CONFIG_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: EXPECTED_RELEASE_SHA,PUBLIC_BASE_URL,PUBLIC_SERVER_NAME,NGINX_CONFIG_PATH
          script: |
            set -e
            set -o pipefail
            cd '/home/ubuntu/极简 crm'
            test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
            test "$(tr -d '\r\n' < .release-sha)" = "$EXPECTED_RELEASE_SHA"
            public_health_url="${PUBLIC_BASE_URL%/}/health"
            sudo /home/ubuntu/venvs/openclaw/bin/python \
              scripts/ops/ensure_production_public_release_route.py --execute \
              --expected-sha "$EXPECTED_RELEASE_SHA" \
              --server-name "$PUBLIC_SERVER_NAME" \
              --nginx-config "$NGINX_CONFIG_PATH" \
              --local-health-url http://127.0.0.1:5001/health \
              --public-health-url "$public_health_url" \
              | tee /tmp/aicrm-public-www-cutover.json

      - name: Verify public WWW exact release
        run: |
          set -e
          public_health_url="${PUBLIC_BASE_URL%/}/health"
          curl --retry 10 --retry-all-errors --connect-timeout 10 --max-time 30 -sSf \
            -D /tmp/aicrm-public-www-health-headers.txt \
            "$public_health_url" \
            -o /tmp/aicrm-public-www-health.json
          actual_sha="$(awk 'tolower($1) == "x-aicrm-release-sha:" {print $2}' \
            /tmp/aicrm-public-www-health-headers.txt | tr -d '\r' | tail -n 1)"
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA"
