name: Relay One WeCom Callback to ID Validation

on:
  workflow_dispatch:
    inputs:
      source_release_sha:
        description: Exact AI-CRM SHA currently running on 124.220.53.183
        required: true
        type: string
      target_release_sha:
        description: Exact ID-refactor SHA currently running on 49.232.57.128
        required: true
        type: string
      scene_sha256:
        description: SHA-256 of the dedicated canary scene; never provide the raw scene
        required: true
        type: string
      confirmation:
        description: Type RELAY ONE CALLBACK FROM 124 TO 49
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aicrm-id-validation-callback-relay
  cancel-in-progress: false

jobs:
  relay:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_HOST: 124.220.53.183
      EXPECTED_SOURCE_SSH_FINGERPRINT: SHA256:qbHmMUPtj9373JhvK807wWcewj5xxhOfuCwq1gu16n8
      EXPECTED_SOURCE_BASE_URL: https://www.youcangogogo.com
      EXPECTED_TARGET_BASE_URL: https://id-dev.youcangogogo.com
      EXPECTED_TARGET_URL: https://id-dev.youcangogogo.com/wecom/external-contact/callback
      SOURCE_RELEASE_SHA: ${{ inputs.source_release_sha }}
      TARGET_RELEASE_SHA: ${{ inputs.target_release_sha }}
      CANARY_SCENE_SHA256: ${{ inputs.scene_sha256 }}
      RELAY_CONFIRMATION: ${{ inputs.confirmation }}
      RELAY_RUN_ID: ${{ github.run_id }}
      RELAY_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout current main workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Assert immutable source and target boundaries
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          set -o pipefail
          test "$GITHUB_REPOSITORY" = "qianlan333/AI-CRM"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test "$DEPLOY_HOST" = "$EXPECTED_SOURCE_HOST"
          test "$RELAY_CONFIRMATION" = "RELAY ONE CALLBACK FROM 124 TO 49"
          printf '%s' "$SOURCE_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$TARGET_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$CANARY_SCENE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test "$EXPECTED_SOURCE_BASE_URL" = "https://www.youcangogogo.com"
          test "$EXPECTED_TARGET_BASE_URL" = "https://id-dev.youcangogogo.com"
          test "$EXPECTED_TARGET_URL" = "https://id-dev.youcangogogo.com/wecom/external-contact/callback"

      - name: Verify both public release SHAs before arming
        run: |
          set -e
          set -o pipefail
          verify_release() {
            base_url="$1"
            expected_sha="$2"
            headers_file="$3"
            curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -fsS \
              -D "$headers_file" \
              -o /dev/null \
              "$base_url/health"
            python3 - "$headers_file" "$expected_sha" <<'PY'
          import re
          import sys
          from pathlib import Path

          headers = Path(sys.argv[1]).read_text(encoding="iso-8859-1")
          values = []
          for line in headers.replace("\r\n", "\n").splitlines():
              name, separator, value = line.partition(":")
              if separator and name.lower() == "x-aicrm-release-sha":
                  values.append(value.strip())
          if values != [sys.argv[2]] or re.fullmatch(r"[0-9a-f]{40}", values[0]) is None:
              raise SystemExit("public release SHA mismatch")
          PY
          }
          verify_release "$EXPECTED_SOURCE_BASE_URL" "$SOURCE_RELEASE_SHA" /tmp/aicrm-relay-source.headers
          verify_release "$EXPECTED_TARGET_BASE_URL" "$TARGET_RELEASE_SHA" /tmp/aicrm-relay-target.headers

      - name: Package exact relay script
        id: relay-script
        run: |
          set -e
          set -o pipefail
          relay_script="scripts/ops/relay_id_validation_wecom_callback.py"
          python3 -m py_compile "$relay_script"
          script_sha256="$(sha256sum "$relay_script" | awk '{print $1}')"
          printf '%s' "$script_sha256" | grep -Eq '^[0-9a-f]{64}$'
          echo "sha256=$script_sha256" >> "$GITHUB_OUTPUT"

      - name: Transfer bounded relay script
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.EXPECTED_SOURCE_SSH_FINGERPRINT }}
          source: scripts/ops/relay_id_validation_wecom_callback.py
          target: /tmp/aicrm-id-validation-callback-relay-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 2
          overwrite: true

      - name: Wait for and relay one exact fresh callback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELAY_SCRIPT_SHA256: ${{ steps.relay-script.outputs.sha256 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.EXPECTED_SOURCE_SSH_FINGERPRINT }}
          command_timeout: 17m
          envs: EXPECTED_SOURCE_HOST,EXPECTED_TARGET_URL,SOURCE_RELEASE_SHA,TARGET_RELEASE_SHA,CANARY_SCENE_SHA256,RELAY_RUN_ID,RELAY_RUN_ATTEMPT,RELAY_SCRIPT_SHA256
          script: |
            set -e
            set -o pipefail
            relay_dir="/tmp/aicrm-id-validation-callback-relay-${RELAY_RUN_ID}-${RELAY_RUN_ATTEMPT}"
            relay_script="${relay_dir}/relay_id_validation_wecom_callback.py"
            cleanup() {
              if [ -f "$relay_script" ]; then
                rm -f -- "$relay_script"
              fi
              if [ -d "$relay_dir" ]; then
                rmdir -- "$relay_dir" 2>/dev/null || true
              fi
            }
            trap cleanup EXIT
            test "$EXPECTED_SOURCE_HOST" = "124.220.53.183"
            test "$EXPECTED_TARGET_URL" = "https://id-dev.youcangogogo.com/wecom/external-contact/callback"
            test -f "$relay_script"
            test "$(sha256sum "$relay_script" | awk '{print $1}')" = "$RELAY_SCRIPT_SHA256"
            cd '/home/ubuntu/极简 crm'
            test "$(git rev-parse HEAD)" = "$SOURCE_RELEASE_SHA"
            test "$(tr -d '\r\n' < .release-sha)" = "$SOURCE_RELEASE_SHA"
            set -a
            source /home/ubuntu/.openclaw-wecom-pg.env
            set +a
            test -n "${DATABASE_URL:-}"
            source /home/ubuntu/venvs/openclaw/bin/activate
            AICRM_ID_VALIDATION_CALLBACK_RELAY_AUTHORIZED=1 \
              python3 "$relay_script" \
                --repository-path '/home/ubuntu/极简 crm' \
                --expected-source-release-sha "$SOURCE_RELEASE_SHA" \
                --expected-target-release-sha "$TARGET_RELEASE_SHA" \
                --scene-sha256 "$CANARY_SCENE_SHA256" \
                --target-url "$EXPECTED_TARGET_URL" \
                --timeout-seconds 900 \
                --maximum-event-age-seconds 12 \
                --apply \
                --confirmation "RELAY_ONE_WECOM_CALLBACK_TO_ID_VALIDATION_${TARGET_RELEASE_SHA}"

      - name: Record redacted relay provenance
        run: |
          {
            echo "## ID-validation callback relay"
            echo ""
            echo "- Source: AI-CRM / 124.220.53.183 / $SOURCE_RELEASE_SHA"
            echo "- Target: AI-CRM-ID-refactor / 49.232.57.128 / $TARGET_RELEASE_SHA"
            echo "- Match: dedicated scene SHA-256 (raw identity redacted)"
            echo "- Replay scope: one fresh callback, no automatic retry"
          } >> "$GITHUB_STEP_SUMMARY"
