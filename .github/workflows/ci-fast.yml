name: PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: pr / gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (Node 24)
        with:
          python-version: "3.10.5"

      - name: Restore hashed Python environment
        id: python-venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: current-tests-${{ runner.os }}-${{ runner.arch }}-py3.10.5-${{ hashFiles('requirements.lock') }}

      - name: Install locked dependencies on cache miss
        if: steps.python-venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock

      - name: Activate Python environment
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (Node 24)
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check code and core behavior
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AICRM_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
          AICRM_NEXT_ENV: test
          AICRM_NEXT_DATA_SOURCE: fixture
          AICRM_WECOM_EXECUTION_MODE: disabled
          SECRET_KEY: pr-gate-test-secret
          WECHAT_SHOP_CALLBACK_TOKEN: pr-gate-callback-token
        run: |
          make check
          python -m pytest tests/high_risk tests/release -q --tb=short --timeout=120 --timeout-method=thread

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: pr-gate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci
          if-no-files-found: warn
          retention-days: 3
